name: V2 visual QA

on:
  push:
    branches:
      - feature/threejs-v2
    paths:
      - 'v2/**'
      - '.github/workflows/v2-visual-qa.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-visual-qa.yml'

permissions:
  contents: read

jobs:
  build-and-screenshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render deterministic visual QA screenshots
        run: npm run test:visual

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manic-v2-visual-qa
          path: v2/qa-screenshots/
          if-no-files-found: warn
          retention-days: 14
