name: V3 Blender slice QA

on:
  push:
    branches:
      - feature/v3-blender-slices
      - feature/v3-slices-05-plus
    paths:
      - 'v3/**'
      - '.github/workflows/v3-visual-qa.yml'
  pull_request:
    paths:
      - 'v3/**'
      - '.github/workflows/v3-visual-qa.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: v3-slice-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  slice-visual-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version | head -n 2
          python3 -c "import numpy; print('numpy', numpy.__version__)"

      - name: Generate Blender GLBs
        run: |
          mkdir -p site/assets/images/models
          blender --background --python v3/blender/hero.py -- --output "$GITHUB_WORKSPACE/site/assets/images/models/manic-hero.glb"
          blender --background --python v3/blender/menu.py -- --output "$GITHUB_WORKSPACE/site/assets/images/models/manic-menu.glb"
          blender --background --python v3/blender/cafe.py -- --output "$GITHUB_WORKSPACE/site/assets/images/models/manic-cafe-base.glb"
          blender --background --python v3/blender/cafe_motion.py -- --input "$GITHUB_WORKSPACE/site/assets/images/models/manic-cafe-base.glb" --output "$GITHUB_WORKSPACE/site/assets/images/models/manic-cafe.glb"
          blender --background --python v3/blender/why.py -- --output "$GITHUB_WORKSPACE/site/assets/images/models/manic-why-base.glb"
          blender --background --python v3/blender/why_motion.py -- --input "$GITHUB_WORKSPACE/site/assets/images/models/manic-why-base.glb" --output "$GITHUB_WORKSPACE/site/assets/images/models/manic-why.glb"
          blender --background --python v3/blender/final.py -- --output "$GITHUB_WORKSPACE/site/assets/images/models/manic-final.glb"
          blender --background --python v3/blender/visit.py -- --output "$GITHUB_WORKSPACE/site/assets/images/models/manic-visit-base.glb"
          blender --background --python v3/blender/visit_motion.py -- --input "$GITHUB_WORKSPACE/site/assets/images/models/manic-visit-base.glb" --output "$GITHUB_WORKSPACE/site/assets/images/models/manic-visit.glb"
          rm -f site/assets/images/models/manic-cafe-base.glb site/assets/images/models/manic-why-base.glb site/assets/images/models/manic-visit-base.glb
          test -s site/assets/images/models/manic-hero.glb
          test -s site/assets/images/models/manic-menu.glb
          test -s site/assets/images/models/manic-cafe.glb
          test -s site/assets/images/models/manic-why.glb
          test -s site/assets/images/models/manic-final.glb
          test -s site/assets/images/models/manic-visit.glb
          ls -lh site/assets/images/models/manic-hero.glb site/assets/images/models/manic-menu.glb site/assets/images/models/manic-cafe.glb site/assets/images/models/manic-why.glb site/assets/images/models/manic-final.glb site/assets/images/models/manic-visit.glb

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install V3 dependencies
        working-directory: v3
        run: npm install --no-audit --no-fund

      - name: Build V3 production bundle
        working-directory: v3
        run: npm run build

      - name: Install Chromium
        working-directory: v3
        run: npx playwright install --with-deps chromium

      - name: Render slice visual QA
        working-directory: v3
        run: npm run test:visual

      - name: Upload V3 review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manic-v3-slice-qa
          path: |
            v3/qa-screenshots/
            site/assets/images/models/manic-hero.glb
            site/assets/images/models/manic-menu.glb
            site/assets/images/models/manic-cafe.glb
            site/assets/images/models/manic-why.glb
            site/assets/images/models/manic-final.glb
            site/assets/images/models/manic-visit.glb
          if-no-files-found: warn
          retention-days: 14
