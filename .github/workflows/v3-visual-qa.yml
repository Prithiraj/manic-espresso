name: V3 Blender slice QA

on:
  push:
    branches:
      - feature/v3-blender-slices
    paths:
      - 'v3/**'
      - '.github/workflows/v3-visual-qa.yml'
  pull_request:
    paths:
      - 'v3/**'
      - '.github/workflows/v3-visual-qa.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hero-static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version | head -n 2

      - name: Generate Blender hero GLB
        run: |
          mkdir -p site/assets/images/models
          blender --background --python v3/blender/hero.py -- --output "$GITHUB_WORKSPACE/site/assets/images/models/manic-hero.glb"
          test -s site/assets/images/models/manic-hero.glb
          ls -lh site/assets/images/models/manic-hero.glb

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install V3 dependencies
        working-directory: v3
        run: npm install --no-audit --no-fund

      - name: Build V3 production bundle
        working-directory: v3
        run: npm run build

      - name: Install Chromium
        working-directory: v3
        run: npx playwright install --with-deps chromium

      - name: Render Hero static QA
        working-directory: v3
        run: npm run test:visual

      - name: Upload Hero review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manic-v3-hero-static-qa
          path: |
            v3/qa-screenshots/
            site/assets/images/models/manic-hero.glb
          if-no-files-found: warn
          retention-days: 14
