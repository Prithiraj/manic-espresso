name: Publish V3 preview to GitHub Pages

on:
  push:
    branches:
      - feature/v3-blender-slices
    paths:
      - 'v3/**'
      - '.github/workflows/v3-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout V3 branch
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version | head -n 2

      - name: Generate current V3 Blender models
        run: |
          mkdir -p site/assets/images/models
          blender --background --python v3/blender/hero.py -- --output "$GITHUB_WORKSPACE/site/assets/images/models/manic-hero.glb"
          blender --background --python v3/blender/menu.py -- --output "$GITHUB_WORKSPACE/site/assets/images/models/manic-menu.glb"
          blender --background --python v3/blender/cafe.py -- --output "$GITHUB_WORKSPACE/site/assets/images/models/manic-cafe-base.glb"
          blender --background --python v3/blender/cafe_motion.py -- --input "$GITHUB_WORKSPACE/site/assets/images/models/manic-cafe-base.glb" --output "$GITHUB_WORKSPACE/site/assets/images/models/manic-cafe.glb"
          blender --background --python v3/blender/why.py -- --output "$GITHUB_WORKSPACE/site/assets/images/models/manic-why-base.glb"
          blender --background --python v3/blender/why_motion.py -- --input "$GITHUB_WORKSPACE/site/assets/images/models/manic-why-base.glb" --output "$GITHUB_WORKSPACE/site/assets/images/models/manic-why.glb"
          rm -f site/assets/images/models/manic-cafe-base.glb site/assets/images/models/manic-why-base.glb
          test -s site/assets/images/models/manic-hero.glb
          test -s site/assets/images/models/manic-menu.glb
          test -s site/assets/images/models/manic-cafe.glb
          test -s site/assets/images/models/manic-why.glb

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build V2
        working-directory: v2
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build V3 preview
        working-directory: v3
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Assemble V1 + V2 + V3 Pages artifact
        run: |
          rm -rf site/v2 site/v3
          mkdir -p site/v2 site/v3
          cp -R v2/dist/. site/v2/
          cp -R v3/dist/. site/v3/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy V3 preview alongside V1 and V2
        id: deployment
        uses: actions/deploy-pages@v5
