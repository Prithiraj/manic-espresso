name: Cache demo images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cache-demo-images.yml

permissions:
  contents: write

jobs:
  cache-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover and download current demo photography
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/assets/images

          python - <<'PY'
          import html
          import pathlib
          import re
          import requests
          from urllib.parse import urljoin

          out = pathlib.Path('site/assets/images')
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Referer': 'https://www.findglocal.com/AU/Perth/216035731919391/Manic-Espresso',
          }

          source = 'https://www.findglocal.com/AU/Perth/216035731919391/Manic-Espresso'
          page = requests.get(source, headers=headers, timeout=30)
          page.raise_for_status()
          text = html.unescape(page.text).replace('\\/', '/')

          patterns = [
              r'https?://img\d+\.findglocal\.com/[^\"\'\s<>]+',
              r'//img\d+\.findglocal\.com/[^\"\'\s<>]+',
          ]
          candidates = []
          for pattern in patterns:
              for value in re.findall(pattern, text):
                  if value.startswith('//'):
                      value = 'https:' + value
                  value = value.rstrip('),;')
                  if any(ext in value.lower() for ext in ('.jpg', '.jpeg', '.png', '.webp')) and value not in candidates:
                      candidates.append(value)

          print(f'Found {len(candidates)} FindGlocal image candidates')
          for value in candidates[:30]:
              print('candidate:', value)

          saved = 0
          for value in candidates:
              if saved >= 6:
                  break
              try:
                  response = requests.get(value, headers=headers, timeout=30)
                  content_type = response.headers.get('content-type', '')
                  if response.status_code != 200 or not content_type.startswith('image/') or len(response.content) < 15000:
                      print('skip:', response.status_code, content_type, len(response.content), value)
                      continue
                  suffix = '.png' if 'png' in content_type else '.webp' if 'webp' in content_type else '.jpg'
                  target = out / f'manic-{saved + 1:02d}{suffix}'
                  target.write_bytes(response.content)
                  print('saved:', target, len(response.content), value)
                  saved += 1
              except Exception as exc:
                  print('error:', value, exc)

          # A known real interior photo from Manic Espresso's Quandoo listing.
          interior_url = 'https://d24horgtq2wtu8.cloudfront.net/80fa9ae7-0d23-48f2-94fe-24da97b44bfd/686659_sld.jpg'
          try:
              response = requests.get(interior_url, headers={'User-Agent': headers['User-Agent']}, timeout=30)
              if response.status_code == 200 and response.headers.get('content-type', '').startswith('image/') and len(response.content) > 15000:
                  (out / 'interior.jpg').write_bytes(response.content)
                  print('saved:', out / 'interior.jpg', len(response.content), interior_url)
              else:
                  print('interior skipped:', response.status_code, response.headers.get('content-type'), len(response.content))
          except Exception as exc:
              print('interior error:', exc)

          if not any(out.glob('manic-*')) and not (out / 'interior.jpg').exists():
              raise SystemExit('No usable demo images were downloaded.')
          PY

          echo 'Downloaded files:'
          find site/assets/images -maxdepth 1 -type f -print -exec file {} \;

      - name: Commit cached images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/images
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m 'Cache demo photography locally'
          git push
