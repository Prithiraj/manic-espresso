name: Cache demo images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cache-demo-images.yml

permissions:
  contents: write

jobs:
  cache-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download demo-only Manic Espresso photography
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/assets/images

          python - <<'PY'
          import html
          import pathlib
          import re
          import requests

          out = pathlib.Path('site/assets/images')
          ua = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          session = requests.Session()
          session.headers.update({'User-Agent': ua})

          def save_image(url, stem, referer=None):
              try:
                  headers = {'Referer': referer} if referer else {}
                  response = session.get(url, headers=headers, timeout=40)
                  content_type = response.headers.get('content-type', '').lower()
                  if response.status_code != 200 or not content_type.startswith('image/') or len(response.content) < 15000:
                      print('skip:', response.status_code, content_type, len(response.content), url)
                      return False
                  suffix = '.png' if 'png' in content_type else '.webp' if 'webp' in content_type else '.jpg'
                  target = out / f'{stem}{suffix}'
                  target.write_bytes(response.content)
                  print('saved:', target, len(response.content), url)
                  return True
              except Exception as exc:
                  print('error:', url, exc)
                  return False

          # Real Manic Espresso interior photo surfaced by the current Quandoo listing.
          save_image(
              'https://d24horgtq2wtu8.cloudfront.net/80fa9ae7-0d23-48f2-94fe-24da97b44bfd/686659_sld.jpg',
              'interior',
              'https://social.quandoo.com/en/groups/Manic%20Espresso'
          )

          # Historical editorial Manic Espresso food photo. Demo only; credited by Urban List to Elle Borgward.
          urban_url = 'https://www.theurbanlist.com/perth/directory/manic-espresso'
          try:
              response = session.get(urban_url, timeout=40)
              print('urban list page:', response.status_code, len(response.content))
              text = html.unescape(response.text).replace('\\/', '/')
              meta_patterns = [
                  r'<meta[^>]+property=[\"\']og:image[\"\'][^>]+content=[\"\']([^\"\']+)',
                  r'<meta[^>]+content=[\"\']([^\"\']+)[\"\'][^>]+property=[\"\']og:image[\"\']',
                  r'<meta[^>]+name=[\"\']twitter:image[\"\'][^>]+content=[\"\']([^\"\']+)',
              ]
              for pattern in meta_patterns:
                  match = re.search(pattern, text, re.I)
                  if match and save_image(match.group(1), 'food-editorial', urban_url):
                      break
          except Exception as exc:
              print('urban list error:', exc)

          # Historical first-hand visit photography from the Manic Espresso Como review page.
          blog_url = 'https://frenchtoastandindiepop.wordpress.com/2015/03/14/manic-espresso-como/'
          try:
              response = session.get(blog_url, timeout=40)
              print('blog page:', response.status_code, len(response.content))
              text = html.unescape(response.text).replace('\\/', '/')
              urls = re.findall(r'https?://[^\"\'\s<>]+', text)
              candidates = []
              for value in urls:
                  value = value.rstrip('),;')
                  low = value.lower()
                  if ('wp.com' in low or 'wordpress.com' in low) and '/2015/03/' in low and any(ext in low for ext in ('.jpg', '.jpeg', '.png', '.webp')):
                      if value not in candidates:
                          candidates.append(value)
              print('blog image candidates:', len(candidates))
              saved = 0
              for value in candidates:
                  if saved >= 5:
                      break
                  if save_image(value, f'visit-{saved + 1:02d}', blog_url):
                      saved += 1
          except Exception as exc:
              print('blog error:', exc)

          downloaded = list(out.glob('*'))
          if len(downloaded) < 2:
              raise SystemExit(f'Only {len(downloaded)} usable demo images were downloaded; refusing to commit an incomplete set.')
          PY

          echo 'Downloaded files:'
          find site/assets/images -maxdepth 1 -type f -print -exec file {} \;

      - name: Commit cached images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/images
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m 'Cache demo photography locally'
          git push
